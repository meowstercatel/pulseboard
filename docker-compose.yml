services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-pulseboard}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies the pending migrations in backend/migrations, then exits.
  migrate:
    build:
      context: .
      target: backend
    command: ["pnpm", "prisma", "db", "migrate", "--no-interactive"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulseboard}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-pulseboard}
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      target: runtime
      args:
        GIT_BRANCH: ${GIT_BRANCH:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pulseboard}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-pulseboard}
      # set to "true" when the server sits behind a reverse proxy, see src/auth/rateLimit.ts
      TRUST_PROXY: ${TRUST_PROXY:-}
      # public origin, e.g. https://pulseboard.example.com; OAuth redirect URIs are built from it
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Google/Facebook login is enabled for each provider whose credentials are set
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      # empty unless the deploy sets it; staging points it at the mailpit service
      SMTP_URL: ${SMTP_URL:-}
      # sender of verification emails, defaults to PulseBoard <no-reply@pulseboard.local>
      MAIL_FROM: ${MAIL_FROM:-}
      # payments are disabled (503) while these are empty, see src/routes/billing.ts
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_SUBSCRIPTION: ${STRIPE_PRICE_SUBSCRIPTION:-}
      STRIPE_PRICE_LIFETIME: ${STRIPE_PRICE_LIFETIME:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Daily pg_dump at 03:00 UTC, see "Backups & restore" in backend/README.md
  backup:
    build: ./scripts/backup
    restart: unless-stopped
    init: true
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-pulseboard}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: ${POSTGRES_DB:-pulseboard}
    volumes:
      - ${BACKUP_DIR:-/var/backups/pulseboard}/${COMPOSE_PROJECT_NAME:-pulseboard}:/backups
    depends_on:
      db:
        condition: service_healthy

  # Fake SMTP server + web inbox for staging
  mailpit:
    image: axllent/mailpit
    profiles: [mailpit]
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      # "user:password" to put basic auth on the web UI; empty means no auth
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}

  # Web-based Postgres viewer
  pgweb:
    image: sosedoff/pgweb
    profiles: [pgweb]
    restart: unless-stopped
    ports:
      - "${PGWEB_PORT:-8081}:8081"
    environment:
      PGWEB_DATABASE_URL: postgresql://${POSTGRES_USER:-pulseboard}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-pulseboard}?sslmode=disable
      PGWEB_AUTH_USER: ${PGWEB_AUTH_USER:-}
      PGWEB_AUTH_PASS: ${PGWEB_AUTH_PASS:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
