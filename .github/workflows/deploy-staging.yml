name: deploy-staging
on:
  push:
    branches: [staging]
  workflow_dispatch:

# Separate compose project so staging gets its own containers, network and db volume
# instead of replacing production on the shared runner.
env:
  COMPOSE_PROJECT_NAME: pulseboard-staging
  PORT: 3001
  COMPOSE_PROFILES: mailpit
  SMTP_URL: smtp://mailpit:1025
  MAILPIT_UI_PORT: 8025

jobs:
  deploy:
    environment: staging
    runs-on: [self-hosted, linux, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_SUBSCRIPTION: ${{ vars.STRIPE_PRICE_SUBSCRIPTION }}
          STRIPE_PRICE_LIFETIME: ${{ vars.STRIPE_PRICE_LIFETIME }}
          MAILPIT_UI_AUTH: ${{ secrets.MAILPIT_UI_AUTH }}
        run: |
          export GIT_BRANCH="$GITHUB_REF_NAME" GIT_COMMIT="${GITHUB_SHA::7}"
          docker compose up -d --build --remove-orphans
          docker image prune -f
