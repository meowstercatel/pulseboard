name: tests

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pnpm version comes from packageManager in package.json
      - name: Enable pnpm
        id: pnpm
        run: |
          corepack enable
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check
      - name: Check test types
        run: pnpm run test:typecheck
      - name: Unit tests
        run: pnpm test
      - name: Start test PostgreSQL and Mailpit
        run: pnpm run test:services
      - name: API integration tests
        run: pnpm run test:integration
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build both apps and run browser tests
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop test services
        if: always()
        run: pnpm run test:services:stop
